name: Update haze data

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay runs by a few minutes)
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-haze-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch readings from data.gov.sg
        env:
          DATA_GOV_SG_API_KEY: ${{ secrets.DATA_GOV_SG_API_KEY }}   # optional
        run: python3 scripts/fetch_data.py

      - name: Commit updated tables
        run: |
          git config user.name "haze-bot"
          git config user.email "haze-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update haze data $(date -u +'%Y-%m-%dT%H:%MZ')"
            git pull --rebase --autostash
            git push
          fi
