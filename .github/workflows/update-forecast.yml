name: Update PSI forecast

# The PSI forecast "agent". The main collector (update-data.yml) already runs it every
# 15 minutes after 18:15 SGT; this workflow lets you run it by hand (Actions -> Run workflow)
# and acts as a backup trigger at 18:17 SGT if GitHub's scheduler is working.
on:
  schedule:
    - cron: "17 10 * * *"   # 18:17 SGT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install OCR tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr python3-pil

      - name: Read the forecast from haze.gov.sg
        run: python3 scripts/fetch_forecast.py

      - name: Commit the forecast table
        if: always()
        run: |
          git config user.name "haze-bot"
          git config user.email "haze-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -q -m "Update PSI forecast $(date -u +'%Y-%m-%dT%H:%MZ')"
            git pull -q --rebase --autostash
            git push -q
          fi
